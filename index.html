<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFE · 生理病理药理模拟</title>
<style>
:root{
  --bg:#0a0c10; --panel:#101419; --panel2:#0d1116; --line:#1c242e;
  --txt:#c9d6e2; --dim:#6b7c8f; --acc:#31f0a0; --warn:#ff5c5c; --amber:#ffb347;
  --blue:#5aa9ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:13px/1.45 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;}
body{overflow:hidden}
button{font:inherit;color:var(--txt);background:#161c24;border:1px solid var(--line);
  border-radius:4px;padding:4px 9px;cursor:pointer}
button:hover{border-color:#2c3a49;background:#1b232d}
button.on{background:#12352a;border-color:#1f6b52;color:#7dffcd}
input,select{font:inherit;color:var(--txt);background:#0c1218;border:1px solid var(--line);
  border-radius:4px;padding:4px 6px;outline:none}
input:focus,select:focus{border-color:#2b6b58}
.num{font-family:"Consolas","Cascadia Mono",monospace;font-variant-numeric:tabular-nums}

#app{display:grid;height:100vh;
  grid-template-columns:1fr 1fr 306px;
  grid-template-rows:38px 1.35fr 1fr 34px .72fr;
  grid-template-areas:
    "top top top"
    "ecg ecg pharm"
    "vit labs pharm"
    "ops ops pharm"
    "trend log pharm";
  gap:6px;padding:6px}

#top{grid-area:top;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 10px;
  overflow-x:auto;white-space:nowrap}
#top .brand{font-weight:700;letter-spacing:3px;color:var(--acc);font-size:14px;flex:0 0 auto}
.tgroup{display:flex;align-items:center;gap:6px;flex:0 0 auto}
#tgTools{margin-left:auto}
#clock{font-family:Consolas,monospace;font-size:15px;color:#8fe6c4;min-width:52px}
.spd{display:flex;gap:2px}
.spd button{padding:2px 7px;font-size:12px;white-space:nowrap}

#ecgwrap{grid-area:ecg;position:relative;background:#08090c;border:1px solid var(--line);
  border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
#waveStack{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;padding-top:19px}
.wrow{position:relative;flex:1;min-height:46px}
.wrow canvas{width:100%;height:100%;display:block}
.wrow .wlab{position:absolute;left:7px;top:1px;font-size:10.5px;color:#4f6474;
  pointer-events:none;letter-spacing:.3px}
.wrow .wval{position:absolute;right:9px;bottom:1px;font-size:12px;color:#8fe6c4;pointer-events:none}
#ecgfoot{height:26px;flex:0 0 26px;display:flex;align-items:center;gap:3px;
  padding:0 8px;background:#0b0f14;border-top:1px solid var(--line);
  font-size:11px;color:#4f6474;overflow-x:auto;white-space:nowrap}
#ecgfoot .cl{margin-left:2px;color:#3f5566}
#ecgfoot .vsep{width:1px;height:14px;background:#1b2833;margin:0 5px}
#ecgfoot b{font-weight:400;padding:1px 6px;border:1px solid #1d2a35;border-radius:9px;
  cursor:pointer;color:#5f7285;background:#0b1015;margin-left:2px}
#ecgfoot b:hover{border-color:#2c3a49}
#ecgfoot b.on{color:#bfe9d8;border-color:#2f7f66;background:#0f211b}
#waveChips{display:inline-flex;gap:2px}
#waveChips b{color:#4a5f70}
#waveChips b.on{color:#9dffd4;border-color:#2f7f66;background:#0f211b}
#ecgtop{position:absolute;left:10px;top:4px;right:10px;display:flex;gap:14px;
  align-items:baseline;pointer-events:none}
#rhythmName{font-size:14px;color:#9dffd4;letter-spacing:1px}
#ecgright{font-size:11px;color:#53707f;white-space:nowrap}
#paused{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--amber);
  border:1px solid #6b4d16;background:#241a06;padding:1px 7px;border-radius:3px;display:none}


#alarms{position:absolute;right:10px;bottom:34px;display:flex;flex-direction:column;
  align-items:flex-end;gap:4px;pointer-events:none;max-width:70%}
.alarm{background:rgba(84,10,10,.96);border:1px solid #d33;border-radius:3px;
  padding:3px 10px;font-size:12.5px;color:#ffe2e2;white-space:nowrap;
  box-shadow:0 0 10px rgba(200,40,40,.35)}
.alarm b{color:#ff9c9c;font-weight:600}
.alarm.amber{background:rgba(70,46,6,.96);border-color:#c8901f;color:#ffedc9;
  box-shadow:0 0 10px rgba(200,150,40,.28)}
.alarm.amber b{color:#ffcf6b}

#toasts{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;
  flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:4}
.toast{background:rgba(96,10,10,.97);border:1px solid #e33;border-left:4px solid #ff4d4d;
  border-radius:4px;padding:6px 14px;font-size:13.5px;color:#ffe8e8;
  box-shadow:0 4px 18px rgba(0,0,0,.6),0 0 14px rgba(220,40,40,.35);
  }
.toast b{color:#fff;font-weight:700}
.toast.amber{background:rgba(74,50,6,.97);border-color:#e0a52a;border-left-color:#ffc046;color:#fff3d6}
.toast.amber b{color:#fff}


#deathmask{display:none;position:absolute;inset:0;background:rgba(12,2,2,.62);
  flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5}
#deathmask.show{display:flex}
#deathmask .t{font-size:24px;letter-spacing:8px;color:#ff6b6b;text-indent:8px}
#deathmask .s{font-size:12px;color:#96a3b1}

#vitals{grid-area:vit;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:6px 8px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-content:start}
#labs{grid-area:labs;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:6px 8px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-content:start}

.tile{background:var(--panel2);border:1px solid #171e26;border-radius:4px;padding:3px 6px;
  cursor:pointer;min-height:44px}
.tile:hover{border-color:#2a3d4d}
.tile .k{font-size:10.5px;color:var(--dim);letter-spacing:.3px}
.tile .v{font-family:Consolas,monospace;font-size:17px;color:#dbe8f5;line-height:1.15}
.tile .u{font-size:10px;color:#4d5f72;margin-left:2px}
.tile.bad .v{color:var(--warn);animation:bl 1s steps(2) infinite}
.tile.warn .v{color:var(--amber)}
.tile.sel{border-color:#2f7f66;background:#0f1b18}
@keyframes bl{50%{opacity:.42}}

#pharm{grid-area:pharm;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  display:flex;flex-direction:column;overflow:hidden}
#pharmhead{display:flex;gap:5px;padding:6px}
#pharmhead input{flex:1;min-width:0}
#drugList{flex:1;overflow-y:auto;padding:0 6px 6px}
.drug{border:1px solid #171e26;border-radius:4px;padding:4px 7px;margin-bottom:4px;
  cursor:pointer;background:var(--panel2)}
.drug:hover{border-color:#2a3d4d}
.drug.sel{border-color:#2f7f66}
.drug .n{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.drug .cn{font-size:11px;color:#587084}
.drug .cf{font-size:10px;padding:0 4px;border-radius:2px;border:1px solid}
.cf.A{color:#4cd48a;border-color:#2b6b45}
.cf.B{color:#e0c060;border-color:#6b5a20}
.cf.C{color:#8a93a0;border-color:#39424e}
#drugPanel{border-top:1px solid var(--line);padding:7px;background:#0c1116;display:none}
#drugPanel.show{display:block}
#drugPanel .row{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
#drugPanel .row span{font-size:11px;color:var(--dim)}
#rxList{max-height:104px;overflow-y:auto;font-size:11.5px}
.rx{display:flex;justify-content:space-between;align-items:center;padding:2px 0;
  border-bottom:1px dashed #16202a;gap:6px}
.rx b{font-weight:500;color:#a8bccd}
.rx .c{font-family:Consolas,monospace;color:#7d8fa2;font-size:11px}
.rx button{padding:0 5px;font-size:10.5px}

#trend{grid-area:trend;position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;overflow:hidden}
#trendCv{width:100%;height:100%;display:block}
#trendSel{position:absolute;left:6px;top:4px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 12px)}
#trendSel b{font-size:10px;padding:0 5px;border:1px solid #23303d;border-radius:9px;
  background:#0e141a;cursor:pointer;font-weight:400;color:#5f7285}
#trendSel b.on{color:#bfe9d8;border-color:#2f7f66}

#log{grid-area:log;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:5px 8px;overflow-y:auto;font-size:11.5px}
.lg{display:flex;gap:7px;padding:1px 0;border-bottom:1px solid #10161c}
.lg .t{color:#4f6274;font-family:Consolas,monospace;min-width:38px}
.lg .k{color:#8a7ad0;min-width:34px}
.lg .m{color:#9fb3c6}

#modal{position:fixed;inset:0;background:rgba(4,6,9,.82);display:none;z-index:50;
  align-items:center;justify-content:center;padding:40px}
#modal.show{display:flex}
#modalBox{background:#0d1219;border:1px solid #24303c;border-radius:6px;max-width:820px;
  width:100%;max-height:80vh;overflow:auto;padding:16px 18px}
#modalBox h3{margin:0 0 10px;font-size:15px;color:#9dffd4;font-weight:600}
#modalBox table{width:100%;border-collapse:collapse;font-size:12px}
#modalBox td,#modalBox th{border-bottom:1px solid #172029;padding:3px 6px;text-align:left}
#modalBox th{color:#6b8194;font-weight:500}
.ok{color:#4cd48a}.no{color:#ff6b6b}
#modalBox .close{float:right;margin-top:-4px}

.opsbar{display:flex;gap:5px;padding:5px 8px 0;flex-wrap:wrap;align-items:center}
.opsbar button{padding:3px 8px;font-size:12px}
#ops{grid-area:ops;display:flex;gap:5px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:5px;padding:0 8px}
#ops button{padding:2px 8px;font-size:12px}
#ops select{margin-left:2px}
.hint{font-size:11px;color:#4b5f72}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1d2833;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
#errbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;
  background:#3a0f0f;border-top:1px solid #7a2323;color:#ffb3b3;
  font:12px Consolas,monospace;padding:6px 10px;white-space:pre-wrap;max-height:40vh;overflow:auto}

#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:36}
body.pharm-open #scrim{display:block}
#fab{display:none;position:fixed;right:14px;bottom:16px;z-index:45;
  padding:11px 20px;border-radius:22px;font-size:14px;font-weight:600;
  background:#12352a;border:1px solid #2f7f66;color:#9dffd4;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
#pharmClose{display:none}

/* ── 手机 ─────────────────────────────────── */
@media (max-width:860px){
  html,body{height:auto;overflow-y:auto;overflow-x:hidden}
  body{-webkit-text-size-adjust:100%}
  #app{display:flex;flex-direction:column;height:auto;
    min-height:100vh;min-height:100dvh;padding:5px;gap:5px}
  #top{flex-wrap:wrap;height:auto;padding:6px 8px;gap:5px;
    overflow:visible;white-space:normal}
  #top .brand{flex:0 0 auto}
  #presetSel{flex:1 1 auto;min-width:0;padding:7px}
  #tgTime{flex:1 1 100%;justify-content:space-between;gap:5px}
  #tgTools{flex:1 1 100%;margin-left:0;display:flex;flex-wrap:wrap;gap:4px}
  #tgTools button{flex:1 1 calc(50% - 4px);min-width:0;padding:7px 2px;
    font-size:11.5px;white-space:nowrap;text-align:center}
  #clock{min-width:40px;font-size:14px}
  .spd{gap:2px}
  .spd button{flex:1 1 0;padding:6px 2px;font-size:12px;min-width:0}
  #btnStep{padding:6px 7px;font-size:11.5px;flex:0 0 auto}

  #ecgwrap{flex:0 0 290px;height:290px}
  #ecgtop{font-size:11px;gap:8px;left:8px;right:8px}
  #rhythmName{font-size:13px}
  #ecgright{font-size:10px}
  #waveStack{padding-top:17px}
  #ecgfoot{height:30px;flex:0 0 30px}
  #ecgfoot b{padding:2px 7px}

  #vitals,#labs{grid-template-columns:repeat(3,1fr);padding:5px;gap:4px}
  .tile{min-height:50px;padding:4px 6px}
  .tile .k{font-size:10px}
  .tile .v{font-size:17px}
  .tile .u{font-size:9px}

  #ops{height:auto;flex-wrap:wrap;padding:7px 8px;gap:6px}
  #ops button{padding:7px 11px;font-size:13px}
  #ops select{padding:6px}

  #trend{flex:0 0 160px;height:160px}
  #log{flex:0 0 170px;height:170px}

  /* 药房做成上拉面板 */
  #pharm{position:fixed;left:0;right:0;bottom:0;height:78vh;height:78dvh;z-index:40;
    border-radius:12px 12px 0 0;border-bottom:0;
    transform:translateY(103%)}
  body.pharm-open #pharm{transform:none}
  #pharmClose{display:block;padding:5px 12px}
  #fab{display:block}
  body.pharm-open #fab{display:none}
  .drug{padding:8px 10px}
  #drugPanel .row{gap:8px}
  #drugPanel input{font-size:15px;padding:7px}
  #drugPanel button{padding:8px 13px;font-size:13.5px}
  .routeBtn{padding:8px 14px}

  #modal{padding:10px;align-items:flex-end}
  #modalBox{max-height:88vh;max-height:88dvh;padding:14px}
  .toast{font-size:12.5px;padding:5px 11px}
  .alarm{font-size:11.5px;padding:2px 8px}
  #alarms{bottom:36px;max-width:82%}
}

@media (max-width:360px){
  #vitals,#labs{grid-template-columns:repeat(2,1fr)}
  .tile .v{font-size:15.5px}
  #top .brand{display:none}
}
</style>
<script>
window.onerror = function(m, src, line, col){
  var d = document.getElementById('errbar');
  if (!d) return;
  d.style.display = 'block';
  d.textContent += '出错：' + m + '　' + String(src||'').split('/').pop() + ':' + line + '\n';
};
</script>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">LIFE</div>
    <select id="presetSel" title="病人"></select>
    <div class="tgroup" id="tgTime">
      <div id="clock" class="num">00:00</div>
      <div class="spd" id="spdBtns">
        <button data-v="0">暂停</button><button data-v="1" class="on">1×</button><button data-v="2">2×</button><button data-v="4">4×</button><button data-v="8">8×</button><button data-v="16">16×</button>
      </div>
      <button id="btnStep">单步 5s</button>
    </div>
    <div class="tgroup" id="tgTools">
      <button id="btnAudit">待补清单</button>
      <button id="btnCheck">自检</button>
      <button id="btnSave">存档</button>
      <button id="btnLoad">读档</button>
      <button id="btnCsv">导出 CSV</button>
      <button id="btnReset">重开</button>
    </div>
  </div>

  <div id="ecgwrap">
    <div id="waveStack"></div>
    <div id="ecgfoot">
      <span class="cl">走纸</span>
      <b data-paper="12.5">12.5</b><b data-paper="25" class="on">25</b><b data-paper="50">50</b>
      <span class="cl">增益</span>
      <b data-gain="5">5</b><b data-gain="10" class="on">10</b><b data-gain="20">20</b>
      <span class="vsep"></span>
      <span id="waveChips"></span>
    </div>
    <div id="ecgtop">
      <span id="rhythmName">窦性心律</span>
      <span id="ecgright"></span>
    </div>
    <div id="paused">已暂停</div>
    <div id="alarms"></div>
    <div id="toasts"></div>
    <div id="deathmask">
      <div class="t">病人已死亡</div>
      <div class="s" id="deathT">—</div>
      <button id="btnRestart2">重开</button>
    </div>
  </div>

  <div id="vitals"></div>

  <div id="labs"></div>

  <div id="ops">
    <button id="btnShock">除颤 200J</button>
    <button id="btnCpr">胸外按压</button>
    <button id="btnVent">呼吸机</button>
    <button id="btnTube">气管插管</button>
    <span class="hint" id="opsHint">未插管</span>
  </div>

  <div id="trend">
    <canvas id="trendCv"></canvas>
    <div id="trendSel"></div>
  </div>

  <div id="log"></div>

  <div id="pharm">
    <div id="pharmhead">
      <input id="drugSearch" placeholder="搜索药名">
      <select id="catSel"></select>
      <button id="pharmClose">收起</button>
    </div>
    <div id="drugList"></div>
    <div id="drugPanel"></div>
    <div style="border-top:1px solid var(--line);padding:5px 7px 0">
      <div class="hint" style="margin-bottom:3px">体内药物</div>
      <div id="rxList"></div>
    </div>
  </div>
  <button id="fab">药房</button>
  <div id="scrim"></div>
</div>

<div id="modal"><div id="modalBox">
  <button class="close" id="modalClose">关闭</button>
  <h3 id="modalTitle"></h3>
  <div id="modalBody"></div>
</div></div>

<div id="errbar"></div>

<script src="kb.js"></script>
<script src="engine.js"></script>
<script src="ecg.js"></script>
<script src="checks.js"></script>
<script src="ui.js"></script>
</body>
</html>
